<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Automated DevOps Web Server</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e293b;
      padding: 2.5rem;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid #334155;
    }
    h1 { color: #38bdf8; }
    .badge {
      display: inline-block;
      background: #059669;
      color: white;
      padding: 0.3rem 0.8rem;
      border-radius: 999px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Nginx is Running! ✅</div>
    <h1>Automated DevOps Pipeline</h1>
    <p>Infrastructure created with <strong>Terraform</strong> on AWS EC2.</p>
    <p>Configured & Deployed with <strong>Ansible</strong>.</p>
    <p>CI/CD Delivery via <strong>GitHub Actions</strong>.</p>
  </div>
</body>
</html>
