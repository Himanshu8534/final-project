name: CI/CD Infrastructure & Nginx Deploy

# Manual button click se chalega (apply ya destroy choose kar sakte hain)
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action choose karein (apply = Create/Deploy, destroy = Delete Server)'
        required: true
        default: 'apply'
        type: choice
        options:
          - apply
          - destroy

# State file save karne ke liye repo me write permission
permissions:
  contents: write

jobs:
  deploy_or_destroy:
    name: ${{ github.event.inputs.action == 'destroy' && 'Destroy Infrastructure' || 'Provision & Deploy Nginx' }}
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ secrets.AWS_REGION || 'ap-south-1' }}

    steps:
      # Step 1: Code checkout
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: AWS credentials connect karna
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Step 3: Terraform CLI install karna
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      # Step 4: Purani Terraform State file restore karna (Delete karne ke liye zaroori hai)
      - name: Restore Terraform State
        run: |
          if git ls-remote --heads origin terraform-state | grep terraform-state; then
            echo "Found existing terraform-state branch, restoring state file..."
            git fetch origin terraform-state:terraform-state
            git checkout terraform-state -- terraform/terraform.tfstate || true
          else
            echo "No previous state found. Clean run."
          fi

      # Step 5: Terraform Init
      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      # ==========================================
      # 🗑️ DESTROY FLOW (Agar 'destroy' chuna ho)
      # ==========================================
      - name: Terraform Destroy (Delete all resources)
        if: ${{ github.event.inputs.action == 'destroy' }}
        working-directory: terraform
        run: |
          terraform destroy -auto-approve \
            -var="aws_region=${{ env.AWS_REGION }}"

      - name: Print Destroy Summary
        if: ${{ github.event.inputs.action == 'destroy' }}
        run: |
          echo "### 🗑️ Infrastructure Destroyed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** EC2 Instance, Key Pair, aur Security Group AWS se safely delete ho chuke hain." >> $GITHUB_STEP_SUMMARY
          echo "- **Region:** \`${{ env.AWS_REGION }}\`" >> $GITHUB_STEP_SUMMARY

      # ==========================================
      # 🚀 APPLY FLOW (Agar 'apply' chuna ho)
      # ==========================================
      - name: Set up Python for Ansible
        if: ${{ github.event.inputs.action == 'apply' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ansible
        if: ${{ github.event.inputs.action == 'apply' }}
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Setup SSH Key Pair
        if: ${{ github.event.inputs.action == 'apply' }}
        id: ssh_key
        run: |
          mkdir -p ~/.ssh
          if [ -n "${{ secrets.SSH_PRIVATE_KEY }}" ] && [ -n "${{ secrets.SSH_PUBLIC_KEY }}" ]; then
            echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
            echo "${{ secrets.SSH_PUBLIC_KEY }}" > ~/.ssh/id_rsa.pub
          else
            ssh-keygen -t rsa -b 4096 -f ~/.ssh/id_rsa -N ""
          fi
          chmod 600 ~/.ssh/id_rsa
          chmod 644 ~/.ssh/id_rsa.pub
          echo "pub_key_path=$HOME/.ssh/id_rsa.pub" >> $GITHUB_OUTPUT
          echo "priv_key_path=$HOME/.ssh/id_rsa" >> $GITHUB_OUTPUT

      - name: Terraform Apply (Create resources)
        if: ${{ github.event.inputs.action == 'apply' }}
        id: tf_apply
        working-directory: terraform
        run: |
          PUB_KEY_CONTENT=$(cat ${{ steps.ssh_key.outputs.pub_key_path }})
          terraform apply -auto-approve \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -var="ssh_public_key=${PUB_KEY_CONTENT}"
          
          EC2_IP=$(terraform output -raw instance_public_ip)
          echo "ec2_ip=$EC2_IP" >> $GITHUB_OUTPUT

      - name: Configure and Deploy with Ansible
        if: ${{ github.event.inputs.action == 'apply' }}
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          EC2_IP="${{ steps.tf_apply.outputs.ec2_ip }}"
          echo "Deploying to target IP: $EC2_IP"

          ansible-playbook \
            -i "${EC2_IP}," \
            -u ubuntu \
            --private-key "${{ steps.ssh_key.outputs.priv_key_path }}" \
            ansible/playbook.yml

      - name: Print Deployment Summary
        if: ${{ github.event.inputs.action == 'apply' }}
        run: |
          echo "### 🚀 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "- **Cloud Provider:** AWS EC2" >> $GITHUB_STEP_SUMMARY
          echo "- **Web Server:** Nginx" >> $GITHUB_STEP_SUMMARY
          echo "- **Server IP:** \`${{ steps.tf_apply.outputs.ec2_ip }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Live URL:** [http://${{ steps.tf_apply.outputs.ec2_ip }}](<http://${{ steps.tf_apply.outputs.ec2_ip }}>)" >> $GITHUB_STEP_SUMMARY

      # ==========================================
      # 💾 SAVE STATE (Dono ke baad state save karna)
      # ==========================================
      - name: Save Terraform State to Branch
        if: always()
        run: |
          if [ -f terraform/terraform.tfstate ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B terraform-state
            git add -f terraform/terraform.tfstate
            git commit -m "Auto-update terraform state [skip ci]" || echo "No state changes to commit"
            git push origin terraform-state --force || echo "Failed to push state"
          fi
